<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفيق | Rafeeq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@600;700&family=IBM+Plex+Serif:wght@600&display=swap">
<style>
  :root {
    --bg: #f7f5f0; --paper: #ffffff; --ink: #1c2430; --ink2: #3d4757; --muted: #5f6877;
    --line: #e2ddd2; --line2: #cfc8b9; --accent: #0f5b4a; --accent2: #0b4639; --accentbg: #e8f1ee; --sand: #b08a4f;
    --mis: #8a5300; --study: #1d5f8a; --harm: #a3271c; --more: #5d6470; --ok: #0f6b4f;
    --serif: "Noto Naskh Arabic", "IBM Plex Serif", Georgia, serif;
    --body: "IBM Plex Sans Arabic", system-ui, sans-serif;
  }
  html { font-size: clamp(15px, .5vw + 9.5px, 30px); } /* scales up on booth TVs */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; color: var(--ink); font: 1rem/1.7 var(--body); background: var(--bg); display: flex; flex-direction: column; }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; min-height: max(44px, 2.75rem); min-width: 44px; border-radius: .5rem; border: 1px solid var(--line2); background: var(--paper); padding: 0 1rem; transition: background .15s, border-color .15s; }
  button:hover { border-color: var(--accent); background: var(--accentbg); }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; padding: .7rem clamp(1rem, 3vw, 2.5rem); background: var(--paper); border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: .7rem; }
  .mark { width: 2.5rem; height: 2.5rem; border-radius: .5rem; background: var(--accent); color: #fff; display: grid; place-items: center; font: 700 1.35rem/1 var(--serif); flex: none; }
  .brand b { display: block; font: 700 1.2rem/1.2 var(--serif); }
  .brand small { display: block; font-size: .75rem; color: var(--muted); line-height: 1.3; }
  .badge { font-size: .72rem; font-weight: 600; color: var(--accent); border: 1px solid var(--accent); border-radius: .25rem; padding: .1rem .6rem; margin-inline-start: .3rem; white-space: nowrap; }
  .actions { display: flex; gap: .5rem; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: .5rem; overflow: hidden; }
  .seg button { border: none; border-radius: 0; min-width: 3rem; font-size: .9rem; font-weight: 600; background: var(--paper); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  #reset { display: inline-flex; gap: .4rem; align-items: center; font-weight: 600; }
  #gear { width: 2.75rem; padding: 0; display: grid; place-items: center; color: var(--muted); }
  .staff { width: 100%; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: flex-end; font-size: .85rem; color: var(--muted); border-top: 1px solid var(--line); padding-top: .6rem; }
  .staff select, .staff a { color: var(--ink); background: var(--paper); border: 1px solid var(--line2); border-radius: .5rem; min-height: 2.75rem; padding: 0 .6rem; }
  .staff a { display: inline-grid; place-items: center; text-decoration: none; }
  .staff label { display: inline-flex; gap: .4rem; align-items: center; }

  /* layout */
  .layout { flex: 1; width: 100%; max-width: 92rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 21rem; gap: clamp(1rem, 2.5vw, 2.5rem); padding: 0 clamp(1rem, 3vw, 2.5rem); }
  .convo { display: flex; flex-direction: column; min-height: calc(100dvh - 7rem); max-width: 50rem; width: 100%; margin-inline: auto; }

  /* empty state */
  .hero { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 2.2rem 0 1rem; gap: .8rem; }
  .kicker { font-size: .8rem; font-weight: 600; color: var(--accent); letter-spacing: .02em; }
  .hero h1 { margin: 0; font: 700 clamp(1.9rem, 3.6vw, 2.7rem)/1.45 var(--serif); color: var(--ink); }
  :lang(en) .hero h1, :lang(en) .notes h2, :lang(en) .brand b { font-family: "IBM Plex Serif", Georgia, serif; line-height: 1.25; }
  .hero p { margin: 0; color: var(--ink2); max-width: 40rem; }
  .steps { list-style: none; display: flex; flex-wrap: wrap; gap: .2rem 1.2rem; padding: 0; margin: .2rem 0 .4rem; font-size: .82rem; color: var(--muted); }
  .steps::before { content: attr(data-label); font-weight: 600; color: var(--ink2); width: 100%; }
  .steps li { display: flex; align-items: center; gap: .45rem; }
  .steps b { flex: none; display: inline-grid; place-items: center; width: 1.4rem; height: 1.4rem; border-radius: 50%; background: var(--accentbg); color: var(--accent); font-size: .8rem; }
  .samples-h { margin: .6rem 0 0; font-size: .85rem; font-weight: 600; color: var(--muted); }
  .samples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .6rem; width: 100%; }
  .samples button { display: flex; flex-direction: column; align-items: flex-start; gap: .15rem; text-align: start; padding: .8rem .95rem; min-height: 5rem; border-color: var(--line); border-radius: .6rem; }
  .samples b { font-size: .78rem; font-weight: 600; color: var(--accent); }
  .samples span { font-size: .95rem; color: var(--ink); unicode-bidi: plaintext; }
  .convo:has(#log .msg) .hero { display: none; }

  /* conversation */
  #log { display: flex; flex-direction: column; gap: 1rem; padding: 1.5rem 0 1rem; }
  .convo:has(#log .msg) #log { flex: 1; }
  .msg { max-width: 88%; white-space: pre-wrap; unicode-bidi: plaintext; }
  .msg.user { align-self: flex-start; background: var(--accentbg); color: var(--ink); border: 1px solid #cfe0da; padding: .6rem 1rem; border-radius: .9rem; border-start-start-radius: .25rem; }
  .msg.assistant, .msg.vet { align-self: flex-end; background: var(--paper); border: 1px solid var(--line); padding: .75rem 1rem; border-radius: .9rem; border-start-end-radius: .25rem; font-size: 1.03rem; }
  .msg.assistant::before, .msg.vet::before { display: block; font-size: .72rem; font-weight: 700; margin-bottom: .2rem; }
  .msg.assistant::before { content: "رفيق"; color: var(--accent); } :lang(en) .msg.assistant::before { content: "Rafeeq"; }
  .msg.assistant { border-inline-start: 3px solid var(--accent); border-radius: .4rem; }
  .msg.vet { border-color: var(--ok); background: var(--accentbg); }
  .msg.vet::before { content: "الطبيب البيطري"; color: var(--ok); } :lang(en) .msg.vet::before { content: "Veterinarian"; }
  .msg.interim { opacity: .6; font-style: italic; }
  .msg.error { color: var(--harm); }

  /* composer dock */
  .dock { position: sticky; bottom: 0; padding: .8rem 0 1rem; background: linear-gradient(to top, var(--bg) 75%, transparent); }
  .dock label { display: block; font-size: .85rem; font-weight: 600; color: var(--ink2); margin: 0 .2rem .35rem; }
  .composer { display: flex; align-items: center; gap: .5rem; padding: .4rem; border-radius: .8rem; background: var(--paper); border: 1.5px solid var(--line2); box-shadow: 0 .3rem 1.2rem rgba(28,36,48,.07); }
  .composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 .25rem rgba(15,91,74,.15); }
  #text { flex: 1; min-width: 0; border: none; background: transparent; font-size: 1.1rem; min-height: 3.2rem; padding: 0 .7rem; }
  #text:focus-visible { outline: none; }
  #text::placeholder { color: #8a909a; }
  #mic { width: 3.2rem; height: 3.2rem; padding: 0; border-radius: .6rem; display: grid; place-items: center; color: var(--ink2); flex: none; }
  #mic svg { width: 1.35rem; height: 1.35rem; fill: currentColor; }
  #mic.listening { background: var(--harm); border-color: var(--harm); color: #fff; animation: pulse 1.4s ease-in-out infinite; }
  #mic.thinking { color: var(--accent); border-color: var(--accent); }
  #mic.speaking { background: var(--accent); border-color: var(--accent); color: #fff; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 .4rem rgba(163,39,28,.18); } }
  #send { height: 3.2rem; width: 3.2rem; padding: 0; border: none; border-radius: .6rem; background: var(--accent); color: #fff; display: grid; place-items: center; flex: none; }
  #send:hover { background: var(--accent2); }
  #send svg { width: 1.3rem; height: 1.3rem; }
  [dir="rtl"] #send svg { transform: scaleX(-1); }
  .disclaimer { margin: .5rem 0 0; font-size: .82rem; color: var(--ink2); border-inline-start: 3px solid var(--sand); padding-inline-start: .6rem; }
  #status { min-height: 1.4em; font-size: .82rem; color: var(--muted); text-align: center; margin-top: .4rem; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* practice log rail */
  .notes { position: sticky; top: 1rem; align-self: start; margin-top: 1.5rem; background: var(--paper); border: 1px solid var(--line); border-radius: .7rem; overflow: hidden; }
  .notes h2 { margin: 0; padding: .9rem 1rem .1rem; font: 700 1.05rem var(--serif); }
  .notes > p { margin: 0 1rem .6rem; font-size: .78rem; color: var(--muted); }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: .25rem .8rem; margin: 0 1rem .8rem; padding-bottom: .7rem; border-bottom: 1px solid var(--line); font-size: .75rem; color: var(--ink2); }
  .dot { display: inline-block; width: .6rem; height: .6rem; border-radius: 2px; margin-inline-end: .4rem; vertical-align: -.05rem; }
  #records { padding: 0 1rem 1rem; max-height: 70vh; overflow-y: auto; }
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: .5rem; padding: .7rem .8rem; margin-bottom: .55rem; border-inline-start: .25rem solid var(--more); }
  .card h3 { margin: 0; font-size: .95rem; font-weight: 700; unicode-bidi: plaintext; }
  .card .meta { color: var(--muted); font-size: .72rem; }
  .card p { margin: .35rem 0 0; color: var(--ink2); font-size: .8rem; unicode-bidi: plaintext; text-align: start; }
  .card p:empty { display: none; }
  .tag { display: inline-block; margin-top: .35rem; padding: .05rem .5rem; border-radius: .25rem; font-size: .72rem; font-weight: 600; color: #fff; }
  .urgent { color: var(--harm); font-weight: 700; font-size: .82rem; margin-top: .3rem; }
  .review { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .45rem; font-size: .82rem; }
  .approved, .kb { color: var(--ok); font-weight: 600; }
  .waiting { color: var(--mis); font-weight: 600; }
  .urgent::before, .waiting::before, .approved::before, .kb::before { content: ""; display: inline-block; width: .45rem; height: .45rem; margin-inline-end: .4rem; border-radius: 50%; background: currentColor; vertical-align: middle; }
  .vetans { width: 100%; padding: .5rem .6rem; border-radius: .4rem; background: var(--accentbg); unicode-bidi: plaintext; }
  .empty { color: var(--muted); font-size: .85rem; padding: .3rem 0 .5rem; }

  @media (min-width: 1600px) { html { font-size: clamp(20px, 1.05vw, 30px); } .layout { max-width: 110rem; } }
  footer { text-align: center; color: var(--muted); font-size: .75rem; padding: .7rem 1rem 1rem; border-top: 1px solid var(--line); background: var(--paper); }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .notes { position: static; margin: 0 auto 1rem; width: 100%; max-width: 50rem; }
    .convo { min-height: auto; }
    .notes { order: -1; margin-top: 1rem; } .notes:has(.empty) { display: none; } #records { max-height: 30vh; }
  }
  @media (max-width: 640px) {
    .samples { grid-template-columns: minmax(0, 1fr); } .samples button { min-height: auto; }
    .brand small, .badge { display: none; }
    #reset span { display: none; }
  }
</style>
</head>

<header class="top">
  <div class="brand"><div class="mark" aria-hidden="true">ر</div><div><b><span data-i18n="name"></span> <span class="badge" data-i18n="badge"></span></b><small data-i18n="tagline"></small></div></div>

  <aside class="notes">

    <div id="records"><div class="empty" data-i18n="empty"></div></div>
  </aside>
</main>
<footer data-i18n="foot"></footer>

<script>
const $ = (id) => document.getElementById(id);
const CAT = {
  misinformation_to_correct: { ar: "يحتاج تصحيح · Needs a correction", color: "var(--mis)" },
  worth_scientific_study: { ar: "تستحق الدراسة · Worth studying", color: "var(--study)" },
  harmful_awareness: { ar: "قد تضر الحيوان · May harm the animal", color: "var(--harm)" },
  needs_more_info: { ar: "نحتاج تفاصيل أكثر · Needs more detail", color: "var(--more)" },
};

// ---------- state ----------
let messages = [];             // [{role, content}] sent to the server (content includes <record> so Claude keeps context)
let records = {};              // practice_id -> record
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
messages = store.get("rafeeq.messages", []);
records = store.get("rafeeq.records", {});
let cases = {};                 // practice_id -> {code, status, vet}
let sessionId = store.get("rafeeq.session") || newSession();
function newSession() { const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); store.set("rafeeq.session", id); return id; }
const announced = new Set(store.get("rafeeq.announced", []));
["audience"].forEach((id) => { const v = store.get("rafeeq." + id); if (v) $(id).value = v; $(id).onchange = () => store.set("rafeeq." + id, $(id).value); });

// ---------- UI helpers ----------
function addBubble(role, text, cls = "") {
  const d = document.createElement("div");
  d.className = `msg ${role} ${cls}`;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}
function spokenPart(text) { return text.split("<record>")[0].trim(); }
function setStatus(s) {
  if (/جاهز لسؤالك|محادثة جديدة/.test(s)) s = I18N[UI].idle;
  $("status").textContent = UI === "en" ? (STATUS_EN[s] || s) : s.split(" / ")[0];
}
function applyLang(code) {
  UI = code.startsWith("en") ? "en" : "ar";
  const T = I18N[UI];
  document.documentElement.lang = UI; document.documentElement.dir = UI === "en" ? "ltr" : "rtl";
  document.querySelectorAll("[data-i18n]").forEach((el) => el.textContent = T[el.dataset.i18n]);
  $("steps").dataset.label = T.method;
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => el.placeholder = T[el.dataset.i18nPh]);
  document.querySelectorAll("#samples button").forEach((b) => b.dataset.q = T["q_" + b.dataset.k]);
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === code)));
  for (const k in CAT) CAT[k].ar = CAT_TXT[k][UI === "en" ? 1 : 0];
  $("lang").value = code; store.set("rafeeq.lang", code);
  $("status").textContent = T.idle;
  renderRecords();
}
function setMic(state) { $("mic").className = state; }

function renderRecords() {
  const list = Object.values(records);
  const box = $("records");
  if (!list.length) { box.innerHTML = `<div class="empty">${I18N[UI].empty}</div>`; return; }
  box.innerHTML = "";
  for (const r of list.slice().reverse()) {
    const c = CAT[r.category] || CAT.needs_more_info;
    const el = document.createElement("div");
    el.className = "card";
    el.style.borderInlineStartColor = c.color;
    el.innerHTML = `
      <h3></h3>
      <div class="meta"></div>
      <span class="tag" style="background:${c.color}"></span>
      ${r.urgent_welfare_flag ? `<div class="urgent">${I18N[UI].urgent}</div>` : ""}
      <p class="rat"></p><p class="note"></p>
      <div class="review"></div>`;
    el.querySelector("h3").textContent = `${r.practice_name || ""} ${r.practice_name_en ? "· " + r.practice_name_en : ""}`;
    el.querySelector(".meta").textContent = [r.domain, r.species, r.practice_type, r.region?.emirate].filter(Boolean).join(" · ");
    el.querySelector(".tag").textContent = c.ar;
    el.querySelector(".rat").textContent = r.rationale || "";
    el.querySelector(".note").textContent = r.vet_note ? I18N[UI].vetnote + r.vet_note : "";
    const rv = el.querySelector(".review");
    const cs = cases[r.practice_id];
    if (cs?.status === "answered") {
      const fc = CAT[cs.vet.final_category] || c;
      rv.innerHTML = `<div class="approved"></div><div class="vetans"></div>`;
      rv.querySelector(".approved").textContent = `${I18N[UI].vetans} (${fc.ar})`;
      rv.querySelector(".vetans").textContent = cs.vet.vet_answer;
    } else if (cs?.status === "auto") {
      rv.innerHTML = `<div class="kb">${I18N[UI].kb}</div>`;
    } else if (cs?.status === "pending") {
      rv.innerHTML = `<div class="waiting"></div>`;
      rv.querySelector(".waiting").textContent = `${I18N[UI].sent} · #${cs.code}`;
    }
    box.appendChild(el);
  }
}

function extractRecords(text) {
  const re = /<record>([\s\S]*?)<\/record>/g;
  let m;
  while ((m = re.exec(text))) {
    try {
      const r = JSON.parse(m[1].trim().replace(/^```(json)?|```$/g, ""));
      if (r.practice_id) { r.updated_at = new Date().toISOString(); records[r.practice_id] = { ...records[r.practice_id], ...r }; }
    } catch (e) { console.warn("bad record JSON", e); }
  }
  store.set("rafeeq.records", records);
  renderRecords();
}

// ---------- text to speech ----------
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() {
  voices = synth ? synth.getVoices() : [];
  const sel = $("voice"), prev = store.get("rafeeq.voice");
  sel.innerHTML = '<option value="">صوت تلقائي / Auto voice</option>';
  voices.filter((v) => /^(ar|en)/i.test(v.lang)).forEach((v) => {
    const o = document.createElement("option"); o.value = v.name; o.textContent = `${v.name} (${v.lang})`; sel.appendChild(o);
  });
  if (prev) sel.value = prev;
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
$("voice").onchange = () => store.set("rafeeq.voice", $("voice").value);

function pickVoice(isArabic) {
  const chosen = voices.find((v) => v.name === $("voice").value);
  if (chosen && chosen.lang.toLowerCase().startsWith(isArabic ? "ar" : "en")) return chosen;
  const pool = voices.filter((v) => v.lang.toLowerCase().startsWith(isArabic ? "ar" : "en"));
  const score = (v) => (/AE|Gulf|Fatima|Hamdan/i.test(v.name + v.lang) ? 4 : 0) + (/Natural|Online|Neural/i.test(v.name) ? 2 : 0) + (/Google/i.test(v.name) ? 1 : 0);
  return pool.sort((a, b) => score(b) - score(a))[0] || null;
}

let speakQueue = 0;
let voiceMode = false; // read replies aloud only when the person spoke; typed questions get silent replies
function speak(sentence) {
  if (!voiceMode) return;
  const clean = sentence.replace(/[*_#`>]/g, "").trim();
  if (!synth || !clean) return;
  const isArabic = /[؀-ۿ]/.test(clean);
  const u = new SpeechSynthesisUtterance(clean);
  const v = pickVoice(isArabic);
  if (v) u.voice = v;
  u.lang = v ? v.lang : (isArabic ? "ar-AE" : "en-US");
  u.rate = 1.0;
  speakQueue++;
  setMic("speaking"); setStatus("يتكلم… اضغط للمقاطعة");
  u.onend = u.onerror = () => { speakQueue--; if (speakQueue <= 0) { speakQueue = 0; onSpeechDone(); } };
  synth.speak(u);
}
function stopSpeaking() { if (synth) synth.cancel(); speakQueue = 0; }

let streamDone = true;
function onSpeechDone() {
  if (!streamDone) return;
  setMic(""); setStatus("جاهز لسؤالك التالي · Ready for your next question");
  if ($("handsfree").checked && !aborted) setTimeout(startListening, 350);
}

// ---------- talking to Claude ----------
let controller = null, aborted = false;
async function sendToClaude(userText) {
  stopSpeaking();
  aborted = false;
  messages.push({ role: "user", content: userText });
  addBubble("user", userText);
  const bubble = addBubble("assistant", "…");
  setMic("thinking"); setStatus("يفكر…");
  streamDone = false;

  let full = "", spokenUpTo = 0, inRecord = false;
  const flushSentences = (final) => {
    if (inRecord) return;
    const visible = full.split("<record")[0];
    if (full.includes("<record")) inRecord = true;
    let rest = visible.slice(spokenUpTo);
    const re = /[^.!?؟\n]+[.!?؟\n]+/g; let m, consumed = 0;
    while ((m = re.exec(rest))) { speak(m[0]); consumed = re.lastIndex; }
    spokenUpTo += consumed;
    if (final || inRecord) { const tail = visible.slice(spokenUpTo); if (tail.trim()) speak(tail); spokenUpTo = visible.length; }
  };

  try {
    controller = new AbortController();
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
      body: JSON.stringify({ messages, sessionId, settings: { audience: $("audience").value } }),
    });
    if (!res.ok) throw new Error(await res.text());
    const reader = res.body.getReader(), dec = new TextDecoder();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      full += dec.decode(value, { stream: true });
      bubble.textContent = spokenPart(full) || "…";
      $("log").scrollTop = $("log").scrollHeight;
      flushSentences(false);
    }
    flushSentences(true);
  } catch (e) {
    if (e.name !== "AbortError") { full += `\n[ERROR] ${e.message}`; }
  }
  streamDone = true;
  if (full.includes("[ERROR]")) bubble.classList.add("error");
  bubble.textContent = spokenPart(full) || "…";
  full = full.replace(/<cases>[\s\S]*?<\/cases>/g, "").trim();
  if (full.trim()) messages.push({ role: "assistant", content: full });
  else messages.pop();
  store.set("rafeeq.messages", messages);
  extractRecords(full);
  pollCases();
  if (speakQueue === 0) onSpeechDone();
}

// ---------- speech to text ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function startListening() {
  if (!SR) { setStatus("المتصفح لا يدعم التعرف على الكلام. استخدم Chrome أو Edge، أو اكتب."); return; }
  if (listening) return;
  stopSpeaking();
  voiceMode = true;
  rec = new SR();
  rec.lang = $("lang").value;
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = "", interim = null;
  rec.onstart = () => { listening = true; setMic("listening"); setStatus("أسمعك… / Listening…"); };
  rec.onresult = (ev) => {
    let txt = ""; finalText = "";
    for (const r of ev.results) { if (r.isFinal) finalText += r[0].transcript; else txt += r[0].transcript; }
    if (!interim) interim = addBubble("user", "", "interim");
    interim.textContent = finalText + txt;
  };
  rec.onerror = (ev) => { if (ev.error === "not-allowed") setStatus("اسمح للمتصفح باستخدام الميكروفون."); else if (ev.error !== "no-speech" && ev.error !== "aborted") setStatus("خطأ في الميكروفون: " + ev.error); };
  rec.onend = () => {
    listening = false; setMic("");
    if (interim) interim.remove();
    const text = (finalText || interim?.textContent || "").trim();
    if (text) sendToClaude(text);
    else setStatus("جاهز لسؤالك التالي · Ready for your next question");
  };
  rec.start();
}

$("mic").onclick = () => {
  if (listening) { rec.stop(); return; }                       // finish talking
  if (speakQueue > 0 || !streamDone) {                           // interrupt Rafeeq
    aborted = true; stopSpeaking(); if (controller && !streamDone) controller.abort();
    setMic(""); setStatus("تم الإيقاف. اضغط وتكلم"); return;
  }
  startListening();
};
$("gear").onclick = () => { $("staff").hidden = !$("staff").hidden; };
document.querySelectorAll("#samples button").forEach((b) => b.onclick = () => { voiceMode = false; sendToClaude(b.dataset.q); });
$("send").onclick = () => { voiceMode = false; const t = $("text").value.trim(); if (t) { $("text").value = ""; sendToClaude(t); } };
$("text").onkeydown = (e) => { if (e.key === "Enter") $("send").onclick(); };
$("reset").onclick = () => { stopSpeaking(); messages = []; records = {}; cases = {}; sessionId = newSession(); store.set("rafeeq.messages", []); store.set("rafeeq.records", {}); renderRecords(); $("log").innerHTML = ""; setStatus("محادثة جديدة. اضغط وتكلم"); };

// ---------- export ----------
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$("exportJson").onclick = () => download("practices.json", JSON.stringify(Object.values(records), null, 2), "application/json");
$("exportCsv").onclick = () => {
  const cols = ["practice_id","domain","species","breed","practice_name","practice_name_en","practice_type","description","substances","dose","frequency","duration","purpose","claimed_outcome","region","source_type","years_experience","reported_by_expertise","language","category","confidence","evidence_level","rationale","vet_note","urgent_welfare_flag","consent","comparison","ai_advice","referral_needed","answered_from_kb","open_questions","updated_at"];
  const cell = (v) => { const s = v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v); return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = [cols.join(",")].concat(Object.values(records).map((r) => cols.map((c) => cell(r[c])).join(",")));
  download("practices.csv", "﻿" + rows.join("\n"), "text/csv;charset=utf-8");
};

// ---------- vet replies come back here ----------
async function pollCases() {
  try {
    const list = await (await fetch("/api/my-cases?session=" + encodeURIComponent(sessionId))).json();
    cases = {};
    for (const c of list) cases[c.practice_id] = c;
    renderRecords();
    for (const c of list) {
      if (!streamDone) break; // don't touch the conversation while a reply is streaming
      const key = c.id + "|" + c.vet?.answered_at;
      if (c.status === "answered" && !announced.has(key)) {
        announced.add(key); store.set("rafeeq.announced", [...announced]);
        const name = c.record?.practice_name || "";
        const text = `رد الطبيب على حالتك ${c.code} (${name}): ${c.vet.vet_answer}`;
        addBubble("vet", text, "vet");
        messages.push({ role: "user", content: `[System note: the veterinarian has now answered case ${c.code} about ${name}. Final category: ${c.vet.final_category}. Vet's answer: ${c.vet.vet_answer}. Treat this as final if the person asks about it.]` });
        messages.push({ role: "assistant", content: "Noted. I will follow the vet's final answer." });
        store.set("rafeeq.messages", messages);
        if (!listening && streamDone) speak(text);
      }
    }
  } catch {}
}
setInterval(pollCases, 5000);
pollCases();

document.querySelectorAll(".seg button").forEach((b) => b.onclick = () => applyLang(b.dataset.lang));
applyLang(store.get("rafeeq.lang", "ar-AE"));

// restore previous conversation
for (const m of messages) { if (m.content.startsWith("[System note") || m.content.startsWith("Noted. I will follow")) continue; addBubble(m.role, m.role === "assistant" ? spokenPart(m.content) : m.content); }
renderRecords();
</script>
