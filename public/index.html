<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفيق | Rafeeq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<meta name="theme-color" content="#f2f2f7">
<style>
  /* Apple design language (after the Spendings app): system type, inset grouped lists, glass only on floating chrome. */
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7; --bg-2: #ffffff; --label: #000; --label-2: #5f5f64; --label-3: #aeaeb2; --placeholder: #6c6c70;
    --sep: rgba(60,60,67,.16); --fill-2: rgba(120,120,128,.16); --fill-3: rgba(118,118,128,.12);
    --tint: #1f7a5c; --tint-text: #17694e; --on-tint: #fff;
    --bubble: #e9e9eb; --good: #2d7a45; --warn: #a34809; --neg: #b92f27;
    --mis: #b25c00; --study: #2a6fc4; --harm: #c0352c; --more: #6c6c70;
    --i-falcon: #c27a1a; --i-horse: #8a5a3b; --i-saluki: #4f7f9c;
    --glass-bg: rgba(255,255,255,.6); --glass-rim: rgba(255,255,255,.9); --glass-rim-2: rgba(255,255,255,.25); --glass-edge: rgba(0,0,0,.06);
    --glass-shadow: 0 10px 30px rgba(0,0,0,.12), 0 1px 3px rgba(0,0,0,.08);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Arabic", "IBM Plex Sans Arabic", system-ui, "Segoe UI", sans-serif;
    --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Arabic", "IBM Plex Sans Arabic", system-ui, sans-serif;
    --r-group: 22px; --ease-out: cubic-bezier(.23,1,.32,1);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #000; --bg-2: #1c1c1e; --label: #fff; --label-2: #aeaeb2; --label-3: #636366; --placeholder: #98989d;
    --sep: rgba(84,84,88,.55); --fill-2: rgba(120,120,128,.32); --fill-3: rgba(118,118,128,.24);
    --tint: #4cc293; --tint-text: #6fd3a9; --on-tint: #062a1d; --bubble: #26252a; --good: #6cc788; --warn: #f0a24e; --neg: #f07067;
    --mis: #e08a2c; --study: #5b9cf0; --harm: #ec6a60; --more: #98989d;
    --glass-bg: rgba(40,40,44,.55); --glass-rim: rgba(255,255,255,.28); --glass-rim-2: rgba(255,255,255,.06); --glass-edge: rgba(255,255,255,.08);
    --glass-shadow: 0 10px 30px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.4);
  } }
  html { font-size: 106.25%; -webkit-text-size-adjust: 100%; background: var(--bg); } /* 17px, iOS body size */
  @media (min-width: 1600px) { html { font-size: clamp(19px, 1.05vw, 30px); } } /* booth TV */
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; background: var(--bg); color: var(--label); font: 1rem/1.45 var(--font); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; display: flex; flex-direction: column; }
  :lang(en) body { letter-spacing: -.012em; } /* tracking only for Latin: it breaks Arabic joins */
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; min-height: 44px; min-width: 44px; touch-action: manipulation; transition: transform .16s var(--ease-out), background-color .15s, opacity .2s; }
  button:active { transform: scale(.97); }
  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--tint); outline-offset: 2px; border-radius: 12px; }
  [hidden] { display: none !important; }
  .i { flex: none; display: block; }

  .ambient { position: fixed; inset: 0; z-index: -1; pointer-events: none; background:
    radial-gradient(60% 40% at 10% 0%, color-mix(in srgb, var(--tint) 12%, transparent), transparent 70%),
    radial-gradient(50% 35% at 100% 30%, color-mix(in srgb, var(--study) 8%, transparent), transparent 70%),
    radial-gradient(60% 40% at 50% 100%, color-mix(in srgb, var(--i-falcon) 8%, transparent), transparent 70%), var(--bg); }
  .glass { position: relative; background: var(--glass-bg); -webkit-backdrop-filter: blur(16px) saturate(1.9) brightness(1.04); backdrop-filter: blur(16px) saturate(1.9) brightness(1.04);
    box-shadow: inset 0 1px .5px var(--glass-rim), inset 0 -1px 1px var(--glass-rim-2), 0 0 0 .5px var(--glass-edge), var(--glass-shadow); }
  @media (prefers-reduced-transparency: reduce) { .glass { background: var(--bg-2); backdrop-filter: none; -webkit-backdrop-filter: none; } }

  /* nav bar */
  .top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: .6rem; flex-wrap: wrap; padding: .45rem clamp(1rem, 3vw, 2rem);
    background: color-mix(in srgb, var(--bg) 72%, transparent); -webkit-backdrop-filter: blur(20px) saturate(1.8); backdrop-filter: blur(20px) saturate(1.8); box-shadow: 0 .5px 0 var(--sep); }
  .brand { display: flex; align-items: center; gap: .6rem; min-width: 0; }
  .appicon { width: 2.3rem; height: 2.3rem; border-radius: 22.5%; flex: none; display: grid; place-items: center; color: #fff; font: 700 1.25rem/1 var(--font-display);
    background: linear-gradient(160deg, #3fa57c, #145c44); box-shadow: inset 0 1px .5px rgba(255,255,255,.35), 0 2px 6px rgba(0,0,0,.15); }
  .brand b { display: block; font-size: 1rem; font-weight: 600; line-height: 1.2; }
  .brand small { display: block; font-size: .76rem; color: var(--label-2); line-height: 1.2; }
  .actions { display: flex; gap: .4rem; align-items: center; }
  .seg { position: relative; display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr; padding: 3px; border-radius: 999px; background: var(--fill-3); }
  .seg button { position: relative; min-height: 38px; padding: 0 .9rem; border-radius: 999px; font-size: .85rem; font-weight: 600; color: var(--label-2); }
  .seg button[aria-pressed="true"] { background: var(--bg-2); color: var(--label); box-shadow: 0 2px 6px rgba(0,0,0,.1), inset 0 .5px 0 var(--glass-rim); }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; color: var(--tint-text); }
  .icon-btn:hover { background: var(--fill-3); }
  #reset { display: inline-flex; align-items: center; gap: .35rem; padding: 0 1rem; min-height: 44px; border-radius: 999px; background: color-mix(in srgb, var(--tint) 14%, transparent); color: var(--tint-text); font-size: .88rem; font-weight: 600; }
  .staff { width: 100%; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: flex-end; font-size: .85rem; color: var(--label-2); padding: .4rem 0 .2rem; }
  .staff select, .staff a, .staff button { color: var(--label); background: var(--bg-2); border: 0; border-radius: 999px; min-height: 36px; padding: 0 .9rem; text-decoration: none; display: inline-grid; place-items: center; box-shadow: 0 0 0 .5px var(--sep); }
  .staff label { display: inline-flex; gap: .4rem; align-items: center; }

  /* layout */
  .layout { flex: 1; width: 100%; max-width: 76rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 21rem; gap: clamp(1rem, 3vw, 2.5rem); padding: 0 clamp(1rem, 3vw, 2rem); }
  .convo { display: flex; flex-direction: column; min-height: calc(100dvh - 4rem); max-width: 44rem; width: 100%; margin-inline: auto; }

  /* large title + grouped lists */
  .hero { flex: 1; padding: 1.8rem 0 1rem; }
  .eyebrow { font-size: .82rem; font-weight: 600; color: var(--tint-text); }
  .hero h1 { margin: .2rem 0 .4rem; font: 700 clamp(1.9rem, 4vw, 2.6rem)/1.15 var(--font-display); }
  :lang(en) .hero h1 { letter-spacing: -.02em; }
  .hero > p { margin: 0; color: var(--label-2); max-width: 36rem; }
  .group-title { margin: 1.5rem 0 .5rem; padding-inline: 1rem; font-size: 1.15rem; font-weight: 700; }
  .group { background: var(--bg-2); border-radius: var(--r-group); overflow: hidden; margin: 0; padding: 0; list-style: none; }
  .row { position: relative; display: flex; align-items: center; gap: .8rem; width: 100%; min-height: 3.5rem; padding: .6rem 1rem; text-align: start; border-radius: 0; }
  .row + .row::before { content: ""; position: absolute; top: 0; inset-inline-end: 0; inset-inline-start: 3.9rem; border-top: .5px solid var(--sep); }
  button.row:active { background: var(--fill-3); transform: none; }
  button.row:hover { background: color-mix(in srgb, var(--fill-3) 60%, transparent); }
  .row-icon { width: 2.1rem; height: 2.1rem; flex: none; display: grid; place-items: center; border-radius: 22.5%; color: #fff; background: var(--tint); font-weight: 700; font-size: 1rem; font-style: normal; }
  .row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .row-main b { font-weight: 400; font-size: 1rem; unicode-bidi: plaintext; }
  .row-main span { font-size: .82rem; color: var(--label-2); unicode-bidi: plaintext; }
  .chev { color: var(--label-3); flex: none; }
  [dir="rtl"] .chev { transform: scaleX(-1); }
  .steps .row-icon svg { width: 1.15rem; height: 1.15rem; }
  .samples .row-main b { font-weight: 500; }
  .samples .row-main span { order: -1; font-size: .78rem; font-weight: 600; color: var(--label-2); }
  .convo:has(#log .msg) .hero { display: none; }

  /* conversation: Messages-style */
  #log { display: flex; flex-direction: column; gap: .35rem; padding: 1.5rem 0 1rem; }
  .convo:has(#log .msg) #log { flex: 1; }
  .msg { max-width: 80%; white-space: pre-wrap; unicode-bidi: plaintext; padding: .5rem .85rem; border-radius: 1.15rem; animation: pop .35s var(--ease-out); }
  @keyframes pop { from { opacity: 0; transform: translateY(.4rem) scale(.98); } }
  .msg.user { align-self: flex-start; background: var(--tint); color: var(--on-tint); margin-top: .6rem; }
  .msg.assistant, .msg.vet { align-self: flex-end; background: var(--bubble); }
  .msg.assistant::before, .msg.vet::before { display: block; font-size: .72rem; font-weight: 600; color: var(--label-2); margin-bottom: .1rem; }
  .msg.assistant::before { content: "رفيق"; } :lang(en) .msg.assistant::before { content: "Rafeeq"; }
  .msg.vet { background: color-mix(in srgb, var(--good) 16%, var(--bg-2)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--good) 35%, transparent); }
  .msg.vet::before { content: "الطبيب البيطري"; color: var(--good); } :lang(en) .msg.vet::before { content: "Veterinarian"; }
  .msg.interim { opacity: .55; }
  .msg.error { color: var(--neg); }

  /* floating glass composer */
  .dock { position: sticky; bottom: 0; padding: 1.4rem 0 max(.8rem, env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 55%, color-mix(in srgb, var(--bg) 0%, transparent)); }
  .dock label { display: block; font-size: .8rem; font-weight: 600; color: var(--label-2); margin: 0 1rem .35rem; }
  .composer { display: flex; align-items: center; gap: .35rem; padding: .3rem; border-radius: 999px; }
  .composer:focus-within { box-shadow: inset 0 1px .5px var(--glass-rim), 0 0 0 3px color-mix(in srgb, var(--tint) 35%, transparent), var(--glass-shadow); }
  #text { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 1.06rem; min-height: 2.9rem; padding: 0 .9rem; caret-color: var(--tint); }
  #text:focus-visible { outline: none; }
  #text::placeholder { color: var(--placeholder); }
  #mic, #send { width: 2.9rem; height: 2.9rem; border-radius: 50%; display: grid; place-items: center; flex: none; }
  #mic { color: var(--tint-text); }
  #mic:hover { background: var(--fill-3); }
  #mic svg { width: 1.3rem; height: 1.3rem; fill: currentColor; }
  #mic.listening { background: var(--neg); color: #fff; animation: pulse 1.4s ease-in-out infinite; }
  #mic.thinking { color: var(--label-3); }
  #mic.speaking { background: var(--tint); color: var(--on-tint); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 .4rem color-mix(in srgb, var(--neg) 22%, transparent); } }
  #send { background: var(--tint); color: var(--on-tint); }
  #send svg { width: 1.25rem; height: 1.25rem; }
  #status { min-height: 1.3em; font-size: .78rem; color: var(--label-2); text-align: center; margin-top: .4rem; }
  .disclaimer { margin: .2rem 1rem 0; font-size: .76rem; color: var(--label-2); text-align: center; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* practice log rail */
  .notes { position: sticky; top: 4.5rem; align-self: start; margin-top: 1.8rem; }
  .notes h2 { margin: 0 1rem .15rem; font-size: 1.15rem; font-weight: 700; }
  .notes > p { margin: 0 1rem .7rem; font-size: .8rem; color: var(--label-2); }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: .2rem .8rem; margin: 0 1rem .7rem; font-size: .76rem; color: var(--label-2); }
  .dot { display: inline-block; width: .55rem; height: .55rem; border-radius: 50%; margin-inline-end: .35rem; }
  #records { background: var(--bg-2); border-radius: var(--r-group); max-height: 68vh; overflow-y: auto; }
  .card { position: relative; padding: .8rem 1rem; border-inline-start: 0 solid; }
  .card + .card::before { content: ""; position: absolute; top: 0; inset-inline: 1rem 0; border-top: .5px solid var(--sep); }
  .card h3 { margin: 0; font-size: .95rem; font-weight: 600; unicode-bidi: plaintext; }
  .card .meta { color: var(--label-2); font-size: .74rem; }
  .card p { margin: .3rem 0 0; color: var(--label-2); font-size: .8rem; unicode-bidi: plaintext; text-align: start; }
  .card p:empty { display: none; }
  .tag { display: inline-block; margin-top: .35rem; padding: .1rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 600; color: #fff; }
  .urgent { color: var(--neg); font-weight: 600; font-size: .8rem; margin-top: .3rem; }
  .review { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .4rem; font-size: .8rem; }
  .approved, .kb { color: var(--good); font-weight: 600; }
  .waiting { color: var(--warn); font-weight: 600; }
  .urgent::before, .waiting::before, .approved::before, .kb::before { content: ""; display: inline-block; width: .45rem; height: .45rem; margin-inline-end: .4rem; border-radius: 50%; background: currentColor; vertical-align: middle; }
  .vetans { width: 100%; padding: .5rem .7rem; border-radius: .8rem; background: color-mix(in srgb, var(--good) 12%, transparent); unicode-bidi: plaintext; }
  .empty { color: var(--label-2); font-size: .85rem; padding: .9rem 1rem; }

  footer { text-align: center; color: var(--label-2); font-size: .72rem; padding: .4rem 1rem 1rem; }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .notes { position: static; order: -1; margin: 1rem auto 0; width: 100%; max-width: 44rem; }
    .notes:has(.empty) { display: none; } #records { max-height: 30vh; }
    .convo { min-height: auto; }
  }
  @media (max-width: 640px) {
    .brand small { display: none; }
    #reset span { display: none; } #reset { padding: 0; width: 44px; justify-content: center; }
    .seg button { padding: 0 .65rem; }
  }
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<header class="top">
  <div class="brand"><div class="appicon" aria-hidden="true">ر</div><div><b data-i18n="name"></b><small data-i18n="badge"></small></div></div>
  <div class="actions">
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="ar-AE" aria-pressed="true">العربية</button>
      <button type="button" data-lang="en-US" aria-pressed="false">English</button>
    </div>
    <select id="lang" hidden><option value="ar-AE">ar</option><option value="en-US">en</option></select>
    <button id="reset"><svg class="i" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="newv"></span></button>
    <button id="gear" class="icon-btn" aria-label="Staff settings" title="Staff settings"><svg class="i" viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div class="staff" id="staff" hidden>
    <label>Audience
      <select id="audience">
        <option value="auto">تلقائي / Auto</option>
        <option value="hobbyist">هاوٍ / Hobbyist</option>
        <option value="vet">طبيب بيطري / Vet</option>
      </select>
    </label>
    <label><input type="checkbox" id="handsfree"> Hands-free</label>
    <select id="voice" aria-label="Voice"></select>
    <button id="exportJson">JSON</button>
    <button id="exportCsv">CSV</button>
  </div>
</header>

<main class="layout">
  <section class="convo">
    <div class="hero">
      <div class="eyebrow" data-i18n="kicker"></div>
      <h1 data-i18n="title"></h1>
      <p data-i18n="sub"></p>

      <h2 class="group-title" data-i18n="try"></h2>
      <div class="group samples" id="samples">
        <button class="row" data-k="falcon"><i class="row-icon" style="background:var(--i-falcon)">ص</i><span class="row-main"><span data-i18n="falcon"></span><b data-i18n="q_falcon"></b></span><svg class="i chev" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5l6 6-6 6"/></svg></button>
        <button class="row" data-k="horse"><i class="row-icon" style="background:var(--i-horse)">خ</i><span class="row-main"><span data-i18n="horse"></span><b data-i18n="q_horse"></b></span><svg class="i chev" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5l6 6-6 6"/></svg></button>
        <button class="row" data-k="saluki"><i class="row-icon" style="background:var(--i-saluki)">س</i><span class="row-main"><span data-i18n="saluki"></span><b data-i18n="q_saluki"></b></span><svg class="i chev" width="9" height="15" viewBox="0 0 9 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1.5 1.5l6 6-6 6"/></svg></button>
      </div>

      <h2 class="group-title" data-i18n="method"></h2>
      <ol class="group steps" id="steps">
        <li class="row"><i class="row-icon" style="background:#0a84ff"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H10l-4.2 3.6c-.5.4-1.3.1-1.3-.6V16A2.5 2.5 0 0 1 4 13.5z"/></svg></i><span class="row-main"><b data-i18n="s1"></b></span></li>
        <li class="row"><i class="row-icon" style="background:#5e5ce6"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M11 2l1.8 5.2L18 9l-5.2 1.8L11 16l-1.8-5.2L4 9l5.2-1.8zM18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z"/></svg></i><span class="row-main"><b data-i18n="s2"></b></span></li>
        <li class="row"><i class="row-icon" style="background:#ff375f"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg></i><span class="row-main"><b data-i18n="s3"></b></span></li>
        <li class="row"><i class="row-icon" style="background:#30a46c"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i><span class="row-main"><b data-i18n="s4"></b></span></li>
      </ol>
    </div>
    <div id="log" aria-live="polite"></div>
    <div class="dock">
      <div class="composer glass">
        <input type="text" id="text" autofocus autocomplete="off" data-i18n-ph="ph" aria-label="Message">
        <button id="mic" aria-label="Speak"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12z"/></svg></button>
        <button id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
      <p class="disclaimer" data-i18n="disclaimer"></p>
    </div>
  </section>

  <aside class="notes">
    <h2 data-i18n="notes"></h2>
    <p data-i18n="notes_sub"></p>
    <div class="legend">
      <span><span class="dot" style="background:var(--mis)"></span><span data-i18n="c1"></span></span>
      <span><span class="dot" style="background:var(--study)"></span><span data-i18n="c2"></span></span>
      <span><span class="dot" style="background:var(--harm)"></span><span data-i18n="c3"></span></span>
      <span><span class="dot" style="background:var(--more)"></span><span data-i18n="c4"></span></span>
    </div>
    <div id="records"><div class="empty" data-i18n="empty"></div></div>
  </aside>
</main>
<footer data-i18n="foot"></footer>

<script>
// UI text in one language at a time (Arabic default). Switching also sets the speech-recognition language.
const I18N = {
  ar: { name: "رفيق", tagline: "الموروث والعلم البيطري", badge: "نموذج بحثي · الموروث والعلم البيطري", kicker: "مساعد بحثي للممارسات البيطرية التقليدية", try: "جرّب مثالاً", newv: "زائر جديد", title: "اسأل عن ممارسة تقليدية، ورفيق يقارنها بالأدلة", sub: "اكتب عن علاج أو عادة تقليدية مع صقرك أو خيلك أو سلوقيك. رفيق يقارنها بالأعشاب والطب التقليدي والأدلة البيطرية.",
    s1: "اكتب أو تكلّم", s2: "رفيق ينصحك", s3: "طبيب بيطري يراجع", s4: "يُضاف للمعرفة المعتمدة",
    falcon: "الصقور", horse: "الخيل", saluki: "السلوقي",
    q_falcon: "نعطي الصقر حرمل إذا مرض، زين؟", q_horse: "نكوي الخيل (الوسم) على الرجل إذا عرج", q_saluki: "زيت الزيتون زين لشعر السلوقي؟",
    label: "سؤالك", ph: "مثال: نعطي الصقر حرمل إذا مرض؟", idle: "اكتب سؤالك، أو اضغط زر الميكروفون وتكلّم",
    notes: "سجل الممارسات", notes_sub: "كل ممارسة يذكرها الزوار، وكيف صنّفها رفيق", c1: "يحتاج تصحيح", c2: "تستحق الدراسة", c3: "قد تضر", c4: "تفاصيل أكثر",
    empty: "لا شيء بعد. ابدأ بسؤال.", urgent: "خطر فوري على الحيوان. راجع طبيباً بيطرياً الآن.", vetnote: "ملاحظة الطبيب: ", vetans: "رد الطبيب", kb: "جواب معتمد من الطبيب", sent: "أُحيلت إلى الطبيب", method: "كيف يعمل", foot: "نموذج بحثي لعرض جامعي · رفيق", disclaimer: "نموذج عرض بحثي، وليس استشارة بيطرية. في الطوارئ راجع طبيباً بيطرياً فوراً." },
  en: { name: "Rafeeq", tagline: "Heritage and veterinary science", badge: "Research prototype · Heritage & vet science", kicker: "A research assistant for traditional animal-care practices", try: "Try an example", newv: "New visitor", title: "Ask about a traditional practice. Rafeeq weighs the evidence.", sub: "Tell us about a traditional remedy or practice for your falcon, horse or saluki. Rafeeq checks it against herbal, traditional and veterinary evidence.",
    s1: "Type or speak", s2: "Rafeeq advises", s3: "A vet reviews", s4: "Added to approved knowledge",
    falcon: "Falcons", horse: "Horses", saluki: "Salukis",
    q_falcon: "Is harmal good for a sick falcon?", q_horse: "We fire a horse's leg when it goes lame", q_saluki: "Is olive oil good for a saluki's coat?",
    label: "Your question", ph: "e.g. Is harmal good for a sick falcon?", idle: "Type your question, or tap the microphone to speak",
    notes: "Practice log", notes_sub: "Every practice visitors mention, and how Rafeeq sorted it", c1: "Needs correction", c2: "Worth studying", c3: "May harm", c4: "Needs detail",
    empty: "Nothing yet. Start with a question.", urgent: "Urgent welfare risk. See a vet now.", vetnote: "Vet note: ", vetans: "Vet answer", kb: "Vet-approved answer", sent: "Referred to the vet", method: "How it works", foot: "Research prototype for a university showcase · Rafeeq", disclaimer: "Research demo, not a veterinary consultation. In an emergency, see a vet now." },
};
const STATUS_EN = { "أسمعك… / Listening…": "Listening…", "يفكر…": "Thinking…", "يتكلم… اضغط للمقاطعة": "Speaking… tap to interrupt", "تم الإيقاف. اضغط وتكلم": "Stopped.",
  "اسمح للمتصفح باستخدام الميكروفون.": "Allow microphone access in your browser.", "المتصفح لا يدعم التعرف على الكلام. استخدم Chrome أو Edge، أو اكتب.": "This browser can't do speech. Use Chrome or Edge, or type." };
const CAT_TXT = { misinformation_to_correct: ["يحتاج تصحيح", "Needs correction"], worth_scientific_study: ["تستحق الدراسة", "Worth studying"], harmful_awareness: ["قد تضر الحيوان", "May harm the animal"], needs_more_info: ["نحتاج تفاصيل أكثر", "Needs more detail"] };
let UI = "ar";
</script>
<script>
const $ = (id) => document.getElementById(id);
const CAT = {
  misinformation_to_correct: { ar: "يحتاج تصحيح · Needs a correction", color: "var(--mis)" },
  worth_scientific_study: { ar: "تستحق الدراسة · Worth studying", color: "var(--study)" },
  harmful_awareness: { ar: "قد تضر الحيوان · May harm the animal", color: "var(--harm)" },
  needs_more_info: { ar: "نحتاج تفاصيل أكثر · Needs more detail", color: "var(--more)" },
};

// ---------- state ----------
let messages = [];             // [{role, content}] sent to the server (content includes <record> so Claude keeps context)
let records = {};              // practice_id -> record
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
messages = store.get("rafeeq.messages", []);
records = store.get("rafeeq.records", {});
let cases = {};                 // practice_id -> {code, status, vet}
let sessionId = store.get("rafeeq.session") || newSession();
function newSession() { const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); store.set("rafeeq.session", id); return id; }
const announced = new Set(store.get("rafeeq.announced", []));
["audience"].forEach((id) => { const v = store.get("rafeeq." + id); if (v) $(id).value = v; $(id).onchange = () => store.set("rafeeq." + id, $(id).value); });

// ---------- UI helpers ----------
function addBubble(role, text, cls = "") {
  const d = document.createElement("div");
  d.className = `msg ${role} ${cls}`;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}
function spokenPart(text) { return text.split("<record>")[0].trim(); }
function setStatus(s) {
  if (/جاهز لسؤالك|محادثة جديدة/.test(s)) s = I18N[UI].idle;
  $("status").textContent = UI === "en" ? (STATUS_EN[s] || s) : s.split(" / ")[0];
}
function applyLang(code) {
  UI = code.startsWith("en") ? "en" : "ar";
  const T = I18N[UI];
  document.documentElement.lang = UI; document.documentElement.dir = UI === "en" ? "ltr" : "rtl";
  document.querySelectorAll("[data-i18n]").forEach((el) => el.textContent = T[el.dataset.i18n]);
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => el.placeholder = T[el.dataset.i18nPh]);
  document.querySelectorAll("#samples button").forEach((b) => b.dataset.q = T["q_" + b.dataset.k]);
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === code)));
  for (const k in CAT) CAT[k].ar = CAT_TXT[k][UI === "en" ? 1 : 0];
  $("lang").value = code; store.set("rafeeq.lang", code);
  $("status").textContent = T.idle;
  renderRecords();
}
function setMic(state) { $("mic").className = state; }

function renderRecords() {
  const list = Object.values(records);
  const box = $("records");
  if (!list.length) { box.innerHTML = `<div class="empty">${I18N[UI].empty}</div>`; return; }
  box.innerHTML = "";
  for (const r of list.slice().reverse()) {
    const c = CAT[r.category] || CAT.needs_more_info;
    const el = document.createElement("div");
    el.className = "card";
    el.style.borderInlineStartColor = c.color;
    el.innerHTML = `
      <h3></h3>
      <div class="meta"></div>
      <span class="tag" style="background:${c.color}"></span>
      ${r.urgent_welfare_flag ? `<div class="urgent">${I18N[UI].urgent}</div>` : ""}
      <p class="rat"></p><p class="note"></p>
      <div class="review"></div>`;
    el.querySelector("h3").textContent = `${r.practice_name || ""} ${r.practice_name_en ? "· " + r.practice_name_en : ""}`;
    el.querySelector(".meta").textContent = [r.domain, r.species, r.practice_type, r.region?.emirate].filter(Boolean).join(" · ");
    el.querySelector(".tag").textContent = c.ar;
    el.querySelector(".rat").textContent = r.rationale || "";
    el.querySelector(".note").textContent = r.vet_note ? I18N[UI].vetnote + r.vet_note : "";
    const rv = el.querySelector(".review");
    const cs = cases[r.practice_id];
    if (cs?.status === "answered") {
      const fc = CAT[cs.vet.final_category] || c;
      rv.innerHTML = `<div class="approved"></div><div class="vetans"></div>`;
      rv.querySelector(".approved").textContent = `${I18N[UI].vetans} (${fc.ar})`;
      rv.querySelector(".vetans").textContent = cs.vet.vet_answer;
    } else if (cs?.status === "auto") {
      rv.innerHTML = `<div class="kb">${I18N[UI].kb}</div>`;
    } else if (cs?.status === "pending") {
      rv.innerHTML = `<div class="waiting"></div>`;
      rv.querySelector(".waiting").textContent = `${I18N[UI].sent} · #${cs.code}`;
    }
    box.appendChild(el);
  }
}

function extractRecords(text) {
  const re = /<record>([\s\S]*?)<\/record>/g;
  let m;
  while ((m = re.exec(text))) {
    try {
      const r = JSON.parse(m[1].trim().replace(/^```(json)?|```$/g, ""));
      if (r.practice_id) { r.updated_at = new Date().toISOString(); records[r.practice_id] = { ...records[r.practice_id], ...r }; }
    } catch (e) { console.warn("bad record JSON", e); }
  }
  store.set("rafeeq.records", records);
  renderRecords();
}

// ---------- text to speech ----------
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() {
  voices = synth ? synth.getVoices() : [];
  const sel = $("voice"), prev = store.get("rafeeq.voice");
  sel.innerHTML = '<option value="">صوت تلقائي / Auto voice</option>';
  voices.filter((v) => /^(ar|en)/i.test(v.lang)).forEach((v) => {
    const o = document.createElement("option"); o.value = v.name; o.textContent = `${v.name} (${v.lang})`; sel.appendChild(o);
  });
  if (prev) sel.value = prev;
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
$("voice").onchange = () => store.set("rafeeq.voice", $("voice").value);

function pickVoice(isArabic) {
  const chosen = voices.find((v) => v.name === $("voice").value);
  if (chosen && chosen.lang.toLowerCase().startsWith(isArabic ? "ar" : "en")) return chosen;
  const pool = voices.filter((v) => v.lang.toLowerCase().startsWith(isArabic ? "ar" : "en"));
  const score = (v) => (/AE|Gulf|Fatima|Hamdan/i.test(v.name + v.lang) ? 4 : 0) + (/Natural|Online|Neural/i.test(v.name) ? 2 : 0) + (/Google/i.test(v.name) ? 1 : 0);
  return pool.sort((a, b) => score(b) - score(a))[0] || null;
}

let speakQueue = 0;
let voiceMode = false; // read replies aloud only when the person spoke; typed questions get silent replies
function speak(sentence) {
  if (!voiceMode) return;
  const clean = sentence.replace(/[*_#`>]/g, "").trim();
  if (!synth || !clean) return;
  const isArabic = /[؀-ۿ]/.test(clean);
  const u = new SpeechSynthesisUtterance(clean);
  const v = pickVoice(isArabic);
  if (v) u.voice = v;
  u.lang = v ? v.lang : (isArabic ? "ar-AE" : "en-US");
  u.rate = 1.0;
  speakQueue++;
  setMic("speaking"); setStatus("يتكلم… اضغط للمقاطعة");
  u.onend = u.onerror = () => { speakQueue--; if (speakQueue <= 0) { speakQueue = 0; onSpeechDone(); } };
  synth.speak(u);
}
function stopSpeaking() { if (synth) synth.cancel(); speakQueue = 0; }

let streamDone = true;
function onSpeechDone() {
  if (!streamDone) return;
  setMic(""); setStatus("جاهز لسؤالك التالي · Ready for your next question");
  if ($("handsfree").checked && !aborted) setTimeout(startListening, 350);
}

// ---------- talking to Claude ----------
let controller = null, aborted = false;
async function sendToClaude(userText) {
  stopSpeaking();
  aborted = false;
  messages.push({ role: "user", content: userText });
  addBubble("user", userText);
  const bubble = addBubble("assistant", "…");
  setMic("thinking"); setStatus("يفكر…");
  streamDone = false;

  let full = "", spokenUpTo = 0, inRecord = false;
  const flushSentences = (final) => {
    if (inRecord) return;
    const visible = full.split("<record")[0];
    if (full.includes("<record")) inRecord = true;
    let rest = visible.slice(spokenUpTo);
    const re = /[^.!?؟\n]+[.!?؟\n]+/g; let m, consumed = 0;
    while ((m = re.exec(rest))) { speak(m[0]); consumed = re.lastIndex; }
    spokenUpTo += consumed;
    if (final || inRecord) { const tail = visible.slice(spokenUpTo); if (tail.trim()) speak(tail); spokenUpTo = visible.length; }
  };

  try {
    controller = new AbortController();
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
      body: JSON.stringify({ messages, sessionId, settings: { audience: $("audience").value } }),
    });
    if (!res.ok) throw new Error(await res.text());
    const reader = res.body.getReader(), dec = new TextDecoder();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      full += dec.decode(value, { stream: true });
      bubble.textContent = spokenPart(full) || "…";
      $("log").scrollTop = $("log").scrollHeight;
      flushSentences(false);
    }
    flushSentences(true);
  } catch (e) {
    if (e.name !== "AbortError") { full += `\n[ERROR] ${e.message}`; }
  }
  streamDone = true;
  if (full.includes("[ERROR]")) bubble.classList.add("error");
  bubble.textContent = spokenPart(full) || "…";
  full = full.replace(/<cases>[\s\S]*?<\/cases>/g, "").trim();
  if (full.trim()) messages.push({ role: "assistant", content: full });
  else messages.pop();
  store.set("rafeeq.messages", messages);
  extractRecords(full);
  pollCases();
  if (speakQueue === 0) onSpeechDone();
}

// ---------- speech to text ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function startListening() {
  if (!SR) { setStatus("المتصفح لا يدعم التعرف على الكلام. استخدم Chrome أو Edge، أو اكتب."); return; }
  if (listening) return;
  stopSpeaking();
  voiceMode = true;
  rec = new SR();
  rec.lang = $("lang").value;
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = "", interim = null;
  rec.onstart = () => { listening = true; setMic("listening"); setStatus("أسمعك… / Listening…"); };
  rec.onresult = (ev) => {
    let txt = ""; finalText = "";
    for (const r of ev.results) { if (r.isFinal) finalText += r[0].transcript; else txt += r[0].transcript; }
    if (!interim) interim = addBubble("user", "", "interim");
    interim.textContent = finalText + txt;
  };
  rec.onerror = (ev) => { if (ev.error === "not-allowed") setStatus("اسمح للمتصفح باستخدام الميكروفون."); else if (ev.error !== "no-speech" && ev.error !== "aborted") setStatus("خطأ في الميكروفون: " + ev.error); };
  rec.onend = () => {
    listening = false; setMic("");
    if (interim) interim.remove();
    const text = (finalText || interim?.textContent || "").trim();
    if (text) sendToClaude(text);
    else setStatus("جاهز لسؤالك التالي · Ready for your next question");
  };
  rec.start();
}

$("mic").onclick = () => {
  if (listening) { rec.stop(); return; }                       // finish talking
  if (speakQueue > 0 || !streamDone) {                           // interrupt Rafeeq
    aborted = true; stopSpeaking(); if (controller && !streamDone) controller.abort();
    setMic(""); setStatus("تم الإيقاف. اضغط وتكلم"); return;
  }
  startListening();
};
$("gear").onclick = () => { $("staff").hidden = !$("staff").hidden; };
document.querySelectorAll("#samples button").forEach((b) => b.onclick = () => { voiceMode = false; sendToClaude(b.dataset.q); });
$("send").onclick = () => { voiceMode = false; const t = $("text").value.trim(); if (t) { $("text").value = ""; sendToClaude(t); } };
$("text").onkeydown = (e) => { if (e.key === "Enter") $("send").onclick(); };
$("reset").onclick = () => { stopSpeaking(); messages = []; records = {}; cases = {}; sessionId = newSession(); store.set("rafeeq.messages", []); store.set("rafeeq.records", {}); renderRecords(); $("log").innerHTML = ""; setStatus("محادثة جديدة. اضغط وتكلم"); };

// ---------- export ----------
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$("exportJson").onclick = () => download("practices.json", JSON.stringify(Object.values(records), null, 2), "application/json");
$("exportCsv").onclick = () => {
  const cols = ["practice_id","domain","species","breed","practice_name","practice_name_en","practice_type","description","substances","dose","frequency","duration","purpose","claimed_outcome","region","source_type","years_experience","reported_by_expertise","language","category","confidence","evidence_level","rationale","vet_note","urgent_welfare_flag","consent","comparison","ai_advice","referral_needed","answered_from_kb","open_questions","updated_at"];
  const cell = (v) => { const s = v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v); return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = [cols.join(",")].concat(Object.values(records).map((r) => cols.map((c) => cell(r[c])).join(",")));
  download("practices.csv", "﻿" + rows.join("\n"), "text/csv;charset=utf-8");
};

// ---------- vet replies come back here ----------
async function pollCases() {
  try {
    const list = await (await fetch("/api/my-cases?session=" + encodeURIComponent(sessionId))).json();
    cases = {};
    for (const c of list) cases[c.practice_id] = c;
    renderRecords();
    for (const c of list) {
      if (!streamDone) break; // don't touch the conversation while a reply is streaming
      const key = c.id + "|" + c.vet?.answered_at;
      if (c.status === "answered" && !announced.has(key)) {
        announced.add(key); store.set("rafeeq.announced", [...announced]);
        const name = c.record?.practice_name || "";
        const text = `رد الطبيب على حالتك ${c.code} (${name}): ${c.vet.vet_answer}`;
        addBubble("vet", text, "vet");
        messages.push({ role: "user", content: `[System note: the veterinarian has now answered case ${c.code} about ${name}. Final category: ${c.vet.final_category}. Vet's answer: ${c.vet.vet_answer}. Treat this as final if the person asks about it.]` });
        messages.push({ role: "assistant", content: "Noted. I will follow the vet's final answer." });
        store.set("rafeeq.messages", messages);
        if (!listening && streamDone) speak(text);
      }
    }
  } catch {}
}
setInterval(pollCases, 5000);
pollCases();

document.querySelectorAll(".seg button").forEach((b) => b.onclick = () => applyLang(b.dataset.lang));
applyLang(store.get("rafeeq.lang", "ar-AE"));

// restore previous conversation
for (const m of messages) { if (m.content.startsWith("[System note") || m.content.startsWith("Noted. I will follow")) continue; addBubble(m.role, m.role === "assistant" ? spokenPart(m.content) : m.content); }
renderRecords();
</script>
</body>
</html>
