<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفيق | Rafeeq</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #0b0915; --bg2: #121025; --raise: #18142e; --raise2: #201a3a;
    --sand: #e9c98b; --saffron: #f2a93b; --henna: #b23a2e; --palm: #3f8f6b; --cream: #f7eedc;
    --muted: #a99f8f; --line: rgba(233,201,139,.14); --line2: rgba(233,201,139,.3);
    --mis: #f2a93b; --study: #6fb7e9; --harm: #e65b4f; --more: #9c92ad; --ok: #5cc596;
    --kufi: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
    --body: "IBM Plex Sans Arabic", system-ui, sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  html { font-size: clamp(15px, .5vw + 9.5px, 30px); } /* scales up on booth TVs */
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; color: var(--cream); font: 1rem/1.7 var(--body); background: var(--bg); display: flex; flex-direction: column; }
  body::before { content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1px 1px at 14% 22%, #fff7 50%, transparent), radial-gradient(1px 1px at 81% 12%, #fff6 50%, transparent),
      radial-gradient(1.5px 1.5px at 42% 8%, #fff8 50%, transparent), radial-gradient(1px 1px at 67% 31%, #fff4 50%, transparent),
      radial-gradient(1px 1px at 27% 47%, #fff3 50%, transparent), radial-gradient(1px 1px at 92% 52%, #fff4 50%, transparent),
      radial-gradient(48rem 26rem at 50% -6rem, rgba(242,169,59,.22), transparent 70%),
      radial-gradient(40rem 30rem at 100% 100%, rgba(178,58,46,.12), transparent 70%); }
  button, select, input { font: inherit; color: inherit; }
  button { cursor: pointer; min-height: max(44px, 2.75rem); min-width: 44px; border-radius: .8rem; border: 1px solid var(--line2); background: transparent; padding: 0 1rem; transition: background .2s var(--ease), border-color .2s, transform .15s; }
  button:hover { background: rgba(233,201,139,.08); border-color: var(--sand); } button:active { transform: scale(.97); }
  :focus-visible { outline: 3px solid var(--saffron); outline-offset: 3px; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  /* Al Sadu weave band */
  .sadu { height: .7rem; flex: none; background:
      linear-gradient(135deg, var(--henna) 25%, transparent 25%) -.35rem 0/.7rem .7rem,
      linear-gradient(225deg, var(--henna) 25%, transparent 25%) -.35rem 0/.7rem .7rem,
      linear-gradient(315deg, var(--cream) 25%, transparent 25%) 0 0/.7rem .7rem,
      linear-gradient(45deg, var(--cream) 25%, transparent 25%) 0 0/.7rem .7rem, #1b0f0c; }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: .75rem; flex-wrap: wrap; padding: .8rem clamp(1rem, 3vw, 2.5rem); }
  .brand { display: flex; align-items: center; gap: .65rem; font: 700 1.6rem/1 var(--kufi); color: var(--sand); }
  .brand small { font: 400 .78rem var(--body); color: var(--muted); }
  .eye { position: relative; border-radius: 50%; flex: none; aspect-ratio: 1;
    background: radial-gradient(circle, #0b0806 0 var(--p, 30%), transparent calc(var(--p, 30%) + 1%)), repeating-conic-gradient(rgba(90,40,0,.3) 0 2deg, transparent 2deg 7deg), radial-gradient(circle, #ffd56b 0 26%, var(--saffron) 56%, #a8540f 78%, #2a1503 80%); }
  .eye::after { content: ""; position: absolute; width: 18%; height: 18%; top: 22%; left: 25%; border-radius: 50%; background: radial-gradient(circle, #fff, #fff0 70%); }
  .brand .eye { width: 2.4rem; box-shadow: 0 0 1.2rem rgba(242,169,59,.45); }
  .actions { display: flex; gap: .5rem; align-items: center; }
  .seg { display: inline-flex; border: 1px solid var(--line2); border-radius: .8rem; overflow: hidden; }
  .seg button { border: none; border-radius: 0; min-width: 3rem; font-weight: 600; }
  .seg button[aria-pressed="true"] { background: var(--sand); color: #1b0f0c; }
  #reset { background: var(--saffron); color: #1b0f0c; border: none; font-weight: 700; display: inline-flex; gap: .4rem; align-items: center; }
  #gear { width: 2.75rem; padding: 0; display: grid; place-items: center; }
  .staff { width: 100%; display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; justify-content: flex-end; font-size: .85rem; color: var(--muted); border-top: 1px dashed var(--line2); padding-top: .6rem; }
  .staff select, .staff a { color: var(--cream); background: var(--raise); border: 1px solid var(--line2); border-radius: .6rem; min-height: 2.75rem; padding: 0 .6rem; }
  .staff a { display: inline-grid; place-items: center; text-decoration: none; }
  .staff label { display: inline-flex; gap: .4rem; align-items: center; }

  /* layout */
  .layout { flex: 1; width: 100%; max-width: 104rem; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 22rem; gap: clamp(1rem, 2.5vw, 2.5rem); padding: 0 clamp(1rem, 3vw, 2.5rem); }
  .convo { display: flex; flex-direction: column; min-height: calc(100dvh - 6rem); max-width: 54rem; width: 100%; margin-inline: auto; }

  /* empty state */
  .hero { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem 0 1rem; gap: .9rem; }
  .hero .eye { width: clamp(5.5rem, 10vw, 8rem); box-shadow: 0 0 0 .4rem rgba(233,201,139,.12), 0 0 4rem rgba(242,169,59,.45); animation: breathe 4s ease-in-out infinite; }
  @keyframes breathe { 50% { --p: 34%; box-shadow: 0 0 0 .7rem rgba(233,201,139,.08), 0 0 5rem rgba(242,169,59,.6); } }
  @property --p { syntax: "<percentage>"; inherits: true; initial-value: 30%; }
  .hero h1 { margin: .4rem 0 0; font: 700 clamp(2.4rem, 5vw, 3.6rem)/1.1 var(--kufi); background: linear-gradient(180deg, var(--cream), var(--sand) 60%, var(--saffron)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .hero p { margin: 0; color: var(--muted); max-width: 34rem; }
  .steps { list-style: none; display: flex; flex-wrap: wrap; justify-content: center; gap: .4rem; padding: 0; margin: .3rem 0 .6rem; font-size: .82rem; color: var(--muted); }
  .steps li { display: inline-flex; align-items: center; gap: .4rem; }
  .steps li + li::before { content: ""; width: 1.4rem; border-top: 1px dashed var(--line2); }
  .steps b { display: inline-grid; place-items: center; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--raise2); border: 1px solid var(--line2); color: var(--sand); font: 700 .8rem var(--kufi); }
  .samples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: .75rem; width: 100%; }
  .samples button { display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: .75rem; text-align: start; padding: .9rem; min-height: 5.5rem; background: var(--raise); border-color: var(--line); border-radius: 1.1rem; }
  .samples button:hover { transform: translateY(-2px); border-color: var(--sand); background: var(--raise2); }
  .samples i { grid-row: span 2; width: 2.8rem; height: 2.8rem; border-radius: .7rem; display: grid; place-items: center; font: 700 1.4rem var(--kufi); font-style: normal; color: var(--sand); background: var(--bg2); box-shadow: inset 0 0 0 1px var(--line2), inset 0 -.25rem 0 var(--henna); }
  .samples b { font: 700 1.05rem var(--kufi); color: var(--sand); }
  .samples span { font-size: .85rem; color: var(--cream); opacity: .85; unicode-bidi: plaintext; }
  .convo:has(#log .msg) .hero { display: none; }

  /* conversation */
  #log { display: flex; flex-direction: column; gap: 1.1rem; padding: 1.5rem 0 1rem; }
  .convo:has(#log .msg) #log { flex: 1; }
  .msg { max-width: 88%; white-space: pre-wrap; unicode-bidi: plaintext; animation: rise .35s var(--ease); }
  @keyframes rise { from { opacity: 0; transform: translateY(.4rem); } }
  .msg.user { align-self: flex-start; background: rgba(242,169,59,.14); border: 1px solid rgba(242,169,59,.28); padding: .65rem 1rem; border-radius: 1.1rem 1.1rem 1.1rem .3rem; }
  .msg.assistant, .msg.vet { align-self: flex-end; position: relative; padding-inline-end: 2.6rem; font-size: 1.05rem; }
  .msg.assistant::after, .msg.vet::after { content: ""; position: absolute; inset-inline-end: 0; top: .2rem; width: 1.8rem; height: 1.8rem; border-radius: 50%;
    background: radial-gradient(circle, #0b0806 0 30%, transparent 31%), radial-gradient(circle, #ffd56b 0 26%, var(--saffron) 56%, #a8540f 78%, #2a1503 80%); }
  .msg.vet { background: rgba(63,143,107,.14); border: 1px solid rgba(92,197,150,.4); border-radius: 1rem; padding: .7rem 2.8rem .7rem 1rem; }
  .msg.vet::after { background: var(--palm); box-shadow: inset 0 0 0 .45rem var(--bg); }
  .msg.vet::before { content: "الطبيب البيطري · Vet"; display: block; font: 700 .75rem var(--kufi); color: var(--ok); }
  .msg.interim { opacity: .55; font-style: italic; }
  .msg.error { color: var(--harm); }

  /* composer dock */
  .dock { position: sticky; bottom: 0; padding: .8rem 0 1rem; background: linear-gradient(to top, var(--bg) 70%, transparent); }
  .dock label { display: block; font: 600 .8rem var(--body); color: var(--muted); margin: 0 .4rem .35rem; }
  .composer { display: flex; align-items: center; gap: .5rem; padding: .45rem; border-radius: 1.4rem; background: var(--raise); border: 1.5px solid var(--line2); box-shadow: 0 .8rem 2.5rem rgba(0,0,0,.35); transition: border-color .2s, box-shadow .2s; }
  .composer:focus-within { border-color: var(--sand); box-shadow: 0 0 0 .3rem rgba(242,169,59,.18), 0 .8rem 2.5rem rgba(0,0,0,.35); }
  #text { flex: 1; min-width: 0; border: none; background: transparent; font-size: 1.15rem; min-height: 3.4rem; padding: 0 .8rem; }
  #text:focus-visible { outline: none; }
  #text::placeholder { color: #8d8475; }
  #mic { width: 3.4rem; height: 3.4rem; padding: 0; border-radius: 50%; border: .18rem solid #2a1503; position: relative; flex: none;
    background: radial-gradient(circle, #0b0806 0 var(--p, 32%), transparent calc(var(--p, 32%) + 1%)), repeating-conic-gradient(rgba(90,40,0,.3) 0 2deg, transparent 2deg 7deg), radial-gradient(circle, #ffd56b 0 26%, var(--saffron) 56%, #a8540f 78%, #2a1503 80%);
    transition: --p .35s var(--ease), box-shadow .3s; }
  #mic svg { position: absolute; inset: 0; margin: auto; width: 34%; height: 34%; fill: var(--sand); }
  #mic:hover { box-shadow: 0 0 1.4rem rgba(242,169,59,.6); }
  #mic.listening { --p: 40%; box-shadow: 0 0 0 .3rem var(--palm), 0 0 2rem rgba(92,197,150,.7); animation: pulse 1.4s ease-in-out infinite; }
  #mic.thinking { animation: spin 1.8s linear infinite; }
  #mic.speaking { --p: 24%; box-shadow: 0 0 0 .3rem var(--saffron), 0 0 2rem rgba(242,169,59,.7); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 .6rem rgba(63,143,107,.35), 0 0 2.6rem rgba(92,197,150,.8); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  #send { height: 3.4rem; width: 3.4rem; padding: 0; border: none; border-radius: 1rem; background: var(--saffron); color: #1b0f0c; display: grid; place-items: center; flex: none; }
  #send svg { width: 1.4rem; height: 1.4rem; }
  [dir="rtl"] #send svg { transform: scaleX(-1); }
  #status { min-height: 1.4em; font-size: .82rem; color: var(--muted); text-align: center; margin-top: .45rem; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

  /* field notes rail */
  .notes { position: sticky; top: 1rem; align-self: start; margin-top: 1rem; background: var(--bg2); border: 1px solid var(--line); border-radius: 1.3rem; overflow: hidden; }
  .notes h2 { margin: 0; padding: 1rem 1.1rem .2rem; font: 700 1.2rem var(--kufi); color: var(--sand); }
  .notes > p { margin: 0 1.1rem .7rem; font-size: .8rem; color: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: .3rem .9rem; margin: 0 1.1rem .9rem; font-size: .75rem; color: var(--muted); }
  .dot { display: inline-block; width: .55rem; height: .55rem; transform: rotate(45deg); margin-inline-end: .4rem; }
  #records { padding: 0 1.1rem 1rem; max-height: 70vh; overflow-y: auto; }
  .card { position: relative; background: var(--raise); border-radius: .9rem; padding: .75rem .85rem; margin-bottom: .6rem; border-inline-start: .28rem solid var(--more); animation: rise .35s var(--ease); }
  .card h3 { margin: 0; font: 700 1rem var(--kufi); unicode-bidi: plaintext; }
  .card .meta { color: var(--muted); font-size: .72rem; }
  .card p { margin: .35rem 0 0; color: var(--muted); font-size: .8rem; unicode-bidi: plaintext; direction: ltr; text-align: left; }
  .card p:empty { display: none; }
  .tag { display: inline-block; margin-top: .35rem; padding: .1rem .55rem; border-radius: .3rem; font-size: .72rem; font-weight: 700; color: #1b0f0c; }
  .urgent { color: var(--harm); font-weight: 700; font-size: .82rem; margin-top: .3rem; }
  .review { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: .45rem; font-size: .82rem; }
  .approved, .kb { color: var(--ok); font-weight: 700; }
  .waiting { color: var(--saffron); font-weight: 700; }
  .urgent::before, .waiting::before, .approved::before, .kb::before { content: ""; display: inline-block; width: .5rem; height: .5rem; margin-inline-end: .45rem; transform: rotate(45deg); background: currentColor; vertical-align: middle; }
  .vetans { width: 100%; padding: .55rem; border-radius: .6rem; background: rgba(63,143,107,.14); unicode-bidi: plaintext; }
  .empty { color: var(--muted); font-size: .85rem; padding: .4rem 0 .6rem; }

  footer { text-align: center; color: #7f7768; font-size: .72rem; padding: .3rem 1rem 1rem; }

  @media (max-width: 1100px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .notes { position: static; margin: 0 auto 1rem; width: 100%; max-width: 54rem; }
    .convo { min-height: auto; }
    .hero { padding-top: 1rem; }
  }
  @media (max-width: 640px) {
    .samples { grid-template-columns: minmax(0, 1fr); } .samples button { min-height: auto; }
    .brand small, .steps li + li::before { display: none; }
    #reset span { display: none; }
  }
</style>
</head>
<body>
<div class="sadu" aria-hidden="true"></div>
<header class="top">
  <div class="brand"><div class="eye" aria-hidden="true"></div>رفيق <small data-i18n="tagline"></small></div>
  <div class="actions">
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="ar-AE" aria-pressed="true">ع</button>
      <button type="button" data-lang="en-US" aria-pressed="false">EN</button>
    </div>
    <select id="lang" hidden><option value="ar-AE">ar</option><option value="en-US">en</option></select>
    <button id="reset"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="newv"></span></button>
    <button id="gear" aria-label="Staff settings" title="Staff settings"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="staff" id="staff" hidden>
    <label>Audience
      <select id="audience">
        <option value="auto">تلقائي / Auto</option>
        <option value="hobbyist">هاوٍ / Hobbyist</option>
        <option value="vet">طبيب بيطري / Vet</option>
      </select>
    </label>
    <label><input type="checkbox" id="handsfree"> Hands-free</label>
    <select id="voice" aria-label="Voice"></select>
    <button id="exportJson">JSON</button>
    <button id="exportCsv">CSV</button>
    <a href="/vet">Vet dashboard</a>
  </div>
</header>

<main class="layout">
  <section class="convo">
    <div class="hero">
      <div class="eye" aria-hidden="true"></div>
      <h1 data-i18n="title"></h1>
      <p data-i18n="sub"></p>
      <ol class="steps">
        <li><b>1</b><span data-i18n="s1"></span></li>
        <li><b>2</b><span data-i18n="s2"></span></li>
        <li><b>3</b><span data-i18n="s3"></span></li>
        <li><b>4</b><span data-i18n="s4"></span></li>
      </ol>
      <div class="samples" id="samples">
        <button data-k="falcon"><i>ص</i><b data-i18n="falcon"></b><span data-i18n="q_falcon"></span></button>
        <button data-k="horse"><i>خ</i><b data-i18n="horse"></b><span data-i18n="q_horse"></span></button>
        <button data-k="saluki"><i>س</i><b data-i18n="saluki"></b><span data-i18n="q_saluki"></span></button>
      </div>
    </div>
    <div id="log" aria-live="polite"></div>
    <div class="dock">
      <label for="text" data-i18n="label"></label>
      <div class="composer">
        <input type="text" id="text" autofocus autocomplete="off" data-i18n-ph="ph">
        <button id="mic" aria-label="Speak"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.9V21h2v-2.1A7 7 0 0 0 19 12z"/></svg></button>
        <button id="send" aria-label="Send"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>
    </div>
  </section>

  <aside class="notes">
    <h2 data-i18n="notes"></h2>
    <p data-i18n="notes_sub"></p>
    <div class="legend">
      <span><span class="dot" style="background:var(--mis)"></span><span data-i18n="c1"></span></span>
      <span><span class="dot" style="background:var(--study)"></span><span data-i18n="c2"></span></span>
      <span><span class="dot" style="background:var(--harm)"></span><span data-i18n="c3"></span></span>
      <span><span class="dot" style="background:var(--more)"></span><span data-i18n="c4"></span></span>
    </div>
    <div id="records"><div class="empty" data-i18n="empty"></div></div>
  </aside>
</main>
<footer data-i18n="disclaimer"></footer>

<script>
// UI text in one language at a time (Arabic default). Switching also sets the speech-recognition language.
const I18N = {
  ar: { tagline: "الموروث يلتقي العلم البيطري", newv: "زائر جديد", title: "اسأل رفيق", sub: "اكتب عن علاج أو عادة تقليدية مع صقرك أو خيلك أو سلوقيك. رفيق يقارنها بالأعشاب والطب التقليدي والأدلة البيطرية.",
    s1: "اكتب أو تكلّم", s2: "رفيق ينصحك", s3: "الطبيب يعتمد", s4: "رفيق يتعلّم",
    falcon: "الصقور", horse: "الخيل", saluki: "السلوقي",
    q_falcon: "نعطي الصقر حرمل إذا مرض، زين؟", q_horse: "نكوي الخيل (الوسم) على الرجل إذا عرج", q_saluki: "زيت الزيتون زين لشعر السلوقي؟",
    label: "سؤالك", ph: "مثال: نعطي الصقر حرمل إذا مرض؟", idle: "اكتب سؤالك، أو اضغط عين الصقر وتكلّم",
    notes: "سجل الممارسات", notes_sub: "كل ممارسة يذكرها الزوار، وكيف صنّفها رفيق", c1: "يحتاج تصحيح", c2: "تستحق الدراسة", c3: "قد تضر", c4: "تفاصيل أكثر",
    empty: "لا شيء بعد. ابدأ بسؤال.", disclaimer: "نموذج عرض بحثي، وليس استشارة بيطرية. في الطوارئ راجع طبيباً بيطرياً فوراً." },
  en: { tagline: "Heritage meets veterinary science", newv: "New visitor", title: "Ask Rafeeq", sub: "Tell us about a traditional remedy or practice for your falcon, horse or saluki. Rafeeq checks it against herbal, traditional and veterinary evidence.",
    s1: "Type or speak", s2: "Rafeeq advises", s3: "A vet confirms", s4: "Rafeeq learns",
    falcon: "Falcons", horse: "Horses", saluki: "Salukis",
    q_falcon: "Is harmal good for a sick falcon?", q_horse: "We fire a horse's leg when it goes lame", q_saluki: "Is olive oil good for a saluki's coat?",
    label: "Your question", ph: "e.g. Is harmal good for a sick falcon?", idle: "Type your question, or tap the falcon's eye to speak",
    notes: "Practice log", notes_sub: "Every practice visitors mention, and how Rafeeq sorted it", c1: "Needs correction", c2: "Worth studying", c3: "May harm", c4: "Needs detail",
    empty: "Nothing yet. Start with a question.", disclaimer: "Research demo, not a veterinary consultation. In an emergency, see a vet now." },
};
const STATUS_EN = { "أسمعك… / Listening…": "Listening…", "يفكر…": "Thinking…", "يتكلم… اضغط للمقاطعة": "Speaking… tap to interrupt", "تم الإيقاف. اضغط وتكلم": "Stopped.",
  "اسمح للمتصفح باستخدام الميكروفون.": "Allow microphone access in your browser.", "المتصفح لا يدعم التعرف على الكلام. استخدم Chrome أو Edge، أو اكتب.": "This browser can't do speech. Use Chrome or Edge, or type." };
const CAT_TXT = { misinformation_to_correct: ["يحتاج تصحيح", "Needs correction"], worth_scientific_study: ["تستحق الدراسة", "Worth studying"], harmful_awareness: ["قد تضر الحيوان", "May harm the animal"], needs_more_info: ["نحتاج تفاصيل أكثر", "Needs more detail"] };
let UI = "ar";
</script>
<script>
const $ = (id) => document.getElementById(id);
const CAT = {
  misinformation_to_correct: { ar: "يحتاج تصحيح · Needs a correction", color: "var(--mis)" },
  worth_scientific_study: { ar: "تستحق الدراسة · Worth studying", color: "var(--study)" },
  harmful_awareness: { ar: "قد تضر الحيوان · May harm the animal", color: "var(--harm)" },
  needs_more_info: { ar: "نحتاج تفاصيل أكثر · Needs more detail", color: "var(--more)" },
};

// ---------- state ----------
let messages = [];             // [{role, content}] sent to the server (content includes <record> so Claude keeps context)
let records = {};              // practice_id -> record
const store = {
  get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
messages = store.get("rafeeq.messages", []);
records = store.get("rafeeq.records", {});
let cases = {};                 // practice_id -> {code, status, vet}
let sessionId = store.get("rafeeq.session") || newSession();
function newSession() { const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); store.set("rafeeq.session", id); return id; }
const announced = new Set(store.get("rafeeq.announced", []));
["audience"].forEach((id) => { const v = store.get("rafeeq." + id); if (v) $(id).value = v; $(id).onchange = () => store.set("rafeeq." + id, $(id).value); });

// ---------- UI helpers ----------
function addBubble(role, text, cls = "") {
  const d = document.createElement("div");
  d.className = `msg ${role} ${cls}`;
  d.textContent = text;
  $("log").appendChild(d);
  $("log").scrollTop = $("log").scrollHeight;
  return d;
}
function spokenPart(text) { return text.split("<record>")[0].trim(); }
function setStatus(s) {
  if (/جاهز لسؤالك|محادثة جديدة/.test(s)) s = I18N[UI].idle;
  $("status").textContent = UI === "en" ? (STATUS_EN[s] || s) : s.split(" / ")[0];
}
function applyLang(code) {
  UI = code.startsWith("en") ? "en" : "ar";
  const T = I18N[UI];
  document.documentElement.lang = UI; document.documentElement.dir = UI === "en" ? "ltr" : "rtl";
  document.querySelectorAll("[data-i18n]").forEach((el) => el.textContent = T[el.dataset.i18n]);
  document.querySelectorAll("[data-i18n-ph]").forEach((el) => el.placeholder = T[el.dataset.i18nPh]);
  document.querySelectorAll("#samples button").forEach((b) => b.dataset.q = T["q_" + b.dataset.k]);
  document.querySelectorAll(".seg button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === code)));
  for (const k in CAT) CAT[k].ar = CAT_TXT[k][UI === "en" ? 1 : 0];
  $("lang").value = code; store.set("rafeeq.lang", code);
  $("status").textContent = T.idle;
  renderRecords();
}
function setMic(state) { $("mic").className = state; }

function renderRecords() {
  const list = Object.values(records);
  const box = $("records");
  if (!list.length) { box.innerHTML = `<div class="empty">${I18N[UI].empty}</div>`; return; }
  box.innerHTML = "";
  for (const r of list.slice().reverse()) {
    const c = CAT[r.category] || CAT.needs_more_info;
    const el = document.createElement("div");
    el.className = "card";
    el.style.borderInlineStartColor = c.color;
    el.innerHTML = `
      <h3></h3>
      <div class="meta"></div>
      <span class="tag" style="background:${c.color}"></span>
      ${r.urgent_welfare_flag ? '<div class="urgent">خطر فوري على الحيوان · Urgent: see a vet now</div>' : ""}
      <p class="rat"></p><p class="note"></p>
      <div class="review"></div>`;
    el.querySelector("h3").textContent = `${r.practice_name || ""} ${r.practice_name_en ? "· " + r.practice_name_en : ""}`;
    el.querySelector(".meta").textContent = [r.domain, r.species, r.practice_type, r.region?.emirate].filter(Boolean).join(" · ");
    el.querySelector(".tag").textContent = c.ar;
    el.querySelector(".rat").textContent = r.rationale || "";
    el.querySelector(".note").textContent = r.vet_note ? "Vet note: " + r.vet_note : "";
    const rv = el.querySelector(".review");
    const cs = cases[r.practice_id];
    if (cs?.status === "answered") {
      const fc = CAT[cs.vet.final_category] || c;
      rv.innerHTML = `<div class="approved"></div><div class="vetans"></div>`;
      rv.querySelector(".approved").textContent = `رد الطبيب · Vet answer (${fc.ar})`;
      rv.querySelector(".vetans").textContent = cs.vet.vet_answer;
    } else if (cs?.status === "auto") {
      rv.innerHTML = `<div class="kb">جواب معتمد من الطبيب · Vet-approved answer</div>`;
    } else if (cs?.status === "pending") {
      rv.innerHTML = `<div class="waiting"></div>`;
      rv.querySelector(".waiting").textContent = `أُرسلت للطبيب · Sent to the vet · #${cs.code}`;
    }
    box.appendChild(el);
  }
}

function extractRecords(text) {
  const re = /<record>([\s\S]*?)<\/record>/g;
  let m;
  while ((m = re.exec(text))) {
    try {
      const r = JSON.parse(m[1].trim().replace(/^```(json)?|```$/g, ""));
      if (r.practice_id) { r.updated_at = new Date().toISOString(); records[r.practice_id] = { ...records[r.practice_id], ...r }; }
    } catch (e) { console.warn("bad record JSON", e); }
  }
  store.set("rafeeq.records", records);
  renderRecords();
}

// ---------- text to speech ----------
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() {
  voices = synth ? synth.getVoices() : [];
  const sel = $("voice"), prev = store.get("rafeeq.voice");
  sel.innerHTML = '<option value="">صوت تلقائي / Auto voice</option>';
  voices.filter((v) => /^(ar|en)/i.test(v.lang)).forEach((v) => {
    const o = document.createElement("option"); o.value = v.name; o.textContent = `${v.name} (${v.lang})`; sel.appendChild(o);
  });
  if (prev) sel.value = prev;
}
if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
$("voice").onchange = () => store.set("rafeeq.voice", $("voice").value);

function pickVoice(isArabic) {
  const chosen = voices.find((v) => v.name === $("voice").value);
  if (chosen && chosen.lang.toLowerCase().startsWith(isArabic ? "ar" : "en")) return chosen;
  const pool = voices.filter((v) => v.lang.toLowerCase().startsWith(isArabic ? "ar" : "en"));
  const score = (v) => (/AE|Gulf|Fatima|Hamdan/i.test(v.name + v.lang) ? 4 : 0) + (/Natural|Online|Neural/i.test(v.name) ? 2 : 0) + (/Google/i.test(v.name) ? 1 : 0);
  return pool.sort((a, b) => score(b) - score(a))[0] || null;
}

let speakQueue = 0;
let voiceMode = false; // read replies aloud only when the person spoke; typed questions get silent replies
function speak(sentence) {
  if (!voiceMode) return;
  const clean = sentence.replace(/[*_#`>]/g, "").trim();
  if (!synth || !clean) return;
  const isArabic = /[؀-ۿ]/.test(clean);
  const u = new SpeechSynthesisUtterance(clean);
  const v = pickVoice(isArabic);
  if (v) u.voice = v;
  u.lang = v ? v.lang : (isArabic ? "ar-AE" : "en-US");
  u.rate = 1.0;
  speakQueue++;
  setMic("speaking"); setStatus("يتكلم… اضغط للمقاطعة");
  u.onend = u.onerror = () => { speakQueue--; if (speakQueue <= 0) { speakQueue = 0; onSpeechDone(); } };
  synth.speak(u);
}
function stopSpeaking() { if (synth) synth.cancel(); speakQueue = 0; }

let streamDone = true;
function onSpeechDone() {
  if (!streamDone) return;
  setMic(""); setStatus("جاهز لسؤالك التالي · Ready for your next question");
  if ($("handsfree").checked && !aborted) setTimeout(startListening, 350);
}

// ---------- talking to Claude ----------
let controller = null, aborted = false;
async function sendToClaude(userText) {
  stopSpeaking();
  aborted = false;
  messages.push({ role: "user", content: userText });
  addBubble("user", userText);
  const bubble = addBubble("assistant", "…");
  setMic("thinking"); setStatus("يفكر…");
  streamDone = false;

  let full = "", spokenUpTo = 0, inRecord = false;
  const flushSentences = (final) => {
    if (inRecord) return;
    const visible = full.split("<record")[0];
    if (full.includes("<record")) inRecord = true;
    let rest = visible.slice(spokenUpTo);
    const re = /[^.!?؟\n]+[.!?؟\n]+/g; let m, consumed = 0;
    while ((m = re.exec(rest))) { speak(m[0]); consumed = re.lastIndex; }
    spokenUpTo += consumed;
    if (final || inRecord) { const tail = visible.slice(spokenUpTo); if (tail.trim()) speak(tail); spokenUpTo = visible.length; }
  };

  try {
    controller = new AbortController();
    const res = await fetch("/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" }, signal: controller.signal,
      body: JSON.stringify({ messages, sessionId, settings: { audience: $("audience").value } }),
    });
    if (!res.ok) throw new Error(await res.text());
    const reader = res.body.getReader(), dec = new TextDecoder();
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      full += dec.decode(value, { stream: true });
      bubble.textContent = spokenPart(full) || "…";
      $("log").scrollTop = $("log").scrollHeight;
      flushSentences(false);
    }
    flushSentences(true);
  } catch (e) {
    if (e.name !== "AbortError") { full += `\n[ERROR] ${e.message}`; }
  }
  streamDone = true;
  if (full.includes("[ERROR]")) bubble.classList.add("error");
  bubble.textContent = spokenPart(full) || "…";
  full = full.replace(/<cases>[\s\S]*?<\/cases>/g, "").trim();
  if (full.trim()) messages.push({ role: "assistant", content: full });
  else messages.pop();
  store.set("rafeeq.messages", messages);
  extractRecords(full);
  pollCases();
  if (speakQueue === 0) onSpeechDone();
}

// ---------- speech to text ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
function startListening() {
  if (!SR) { setStatus("المتصفح لا يدعم التعرف على الكلام. استخدم Chrome أو Edge، أو اكتب."); return; }
  if (listening) return;
  stopSpeaking();
  voiceMode = true;
  rec = new SR();
  rec.lang = $("lang").value;
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = "", interim = null;
  rec.onstart = () => { listening = true; setMic("listening"); setStatus("أسمعك… / Listening…"); };
  rec.onresult = (ev) => {
    let txt = ""; finalText = "";
    for (const r of ev.results) { if (r.isFinal) finalText += r[0].transcript; else txt += r[0].transcript; }
    if (!interim) interim = addBubble("user", "", "interim");
    interim.textContent = finalText + txt;
  };
  rec.onerror = (ev) => { if (ev.error === "not-allowed") setStatus("اسمح للمتصفح باستخدام الميكروفون."); else if (ev.error !== "no-speech" && ev.error !== "aborted") setStatus("خطأ في الميكروفون: " + ev.error); };
  rec.onend = () => {
    listening = false; setMic("");
    if (interim) interim.remove();
    const text = (finalText || interim?.textContent || "").trim();
    if (text) sendToClaude(text);
    else setStatus("جاهز لسؤالك التالي · Ready for your next question");
  };
  rec.start();
}

$("mic").onclick = () => {
  if (listening) { rec.stop(); return; }                       // finish talking
  if (speakQueue > 0 || !streamDone) {                           // interrupt Rafeeq
    aborted = true; stopSpeaking(); if (controller && !streamDone) controller.abort();
    setMic(""); setStatus("تم الإيقاف. اضغط وتكلم"); return;
  }
  startListening();
};
$("gear").onclick = () => { $("staff").hidden = !$("staff").hidden; };
document.querySelectorAll("#samples button").forEach((b) => b.onclick = () => { voiceMode = false; sendToClaude(b.dataset.q); });
$("send").onclick = () => { voiceMode = false; const t = $("text").value.trim(); if (t) { $("text").value = ""; sendToClaude(t); } };
$("text").onkeydown = (e) => { if (e.key === "Enter") $("send").onclick(); };
$("reset").onclick = () => { stopSpeaking(); messages = []; records = {}; cases = {}; sessionId = newSession(); store.set("rafeeq.messages", []); store.set("rafeeq.records", {}); renderRecords(); $("log").innerHTML = ""; setStatus("محادثة جديدة. اضغط وتكلم"); };

// ---------- export ----------
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}
$("exportJson").onclick = () => download("practices.json", JSON.stringify(Object.values(records), null, 2), "application/json");
$("exportCsv").onclick = () => {
  const cols = ["practice_id","domain","species","breed","practice_name","practice_name_en","practice_type","description","substances","dose","frequency","duration","purpose","claimed_outcome","region","source_type","years_experience","reported_by_expertise","language","category","confidence","evidence_level","rationale","vet_note","urgent_welfare_flag","consent","comparison","ai_advice","referral_needed","answered_from_kb","open_questions","updated_at"];
  const cell = (v) => { const s = v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v); return '"' + s.replace(/"/g, '""') + '"'; };
  const rows = [cols.join(",")].concat(Object.values(records).map((r) => cols.map((c) => cell(r[c])).join(",")));
  download("practices.csv", "﻿" + rows.join("\n"), "text/csv;charset=utf-8");
};

// ---------- vet replies come back here ----------
async function pollCases() {
  try {
    const list = await (await fetch("/api/my-cases?session=" + encodeURIComponent(sessionId))).json();
    cases = {};
    for (const c of list) cases[c.practice_id] = c;
    renderRecords();
    for (const c of list) {
      if (!streamDone) break; // don't touch the conversation while a reply is streaming
      const key = c.id + "|" + c.vet?.answered_at;
      if (c.status === "answered" && !announced.has(key)) {
        announced.add(key); store.set("rafeeq.announced", [...announced]);
        const name = c.record?.practice_name || "";
        const text = `رد الطبيب على حالتك ${c.code} (${name}): ${c.vet.vet_answer}`;
        addBubble("vet", text, "vet");
        messages.push({ role: "user", content: `[System note: the veterinarian has now answered case ${c.code} about ${name}. Final category: ${c.vet.final_category}. Vet's answer: ${c.vet.vet_answer}. Treat this as final if the person asks about it.]` });
        messages.push({ role: "assistant", content: "Noted. I will follow the vet's final answer." });
        store.set("rafeeq.messages", messages);
        if (!listening && streamDone) speak(text);
      }
    }
  } catch {}
}
setInterval(pollCases, 5000);
pollCases();

document.querySelectorAll(".seg button").forEach((b) => b.onclick = () => applyLang(b.dataset.lang));
applyLang(store.get("rafeeq.lang", "ar-AE"));

// restore previous conversation
for (const m of messages) { if (m.content.startsWith("[System note") || m.content.startsWith("Noted. I will follow")) continue; addBubble(m.role, m.role === "assistant" ? spokenPart(m.content) : m.content); }
renderRecords();
</script>
</body>
</html>
